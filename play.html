  <main id="main">
    <nav class="play-nav" aria-label="play">
      <div class="container">
        <ul class="play-nav__list" role="list">
          <li><a class="play-nav__link" href="#diagnosis" data-i18n="play.nav.dx"></a></li>
          <li><a class="play-nav__link" href="#missions" data-i18n="play.nav.ms"></a></li>

        </ul>

    <!-- ===== 4. 「やりたいこと」ひとこと診断(独立セクション:削除してもOK) ===== -->
    <section id="diagnosis" class="section reveal" aria-labelledby="dx-title">
      <div class="container">
        <p class="section__kicker" data-i18n="dx.kicker"></p>
        <h2 id="dx-title" class="section__title" data-i18n="dx.title"></h2>
        <p data-i18n="dx.lead"></p>
        <p class="note note--lock" data-i18n="dx.privacy"></p>

        <form id="dxForm" class="card dx" novalidate>
          <fieldset class="dx__q">
            <legend class="dx__label" data-i18n="dx.q1"></legend>
            <p class="help" data-i18n="dx.q1Help"></p>
            <div class="pill-group" id="dxWhoGroup">
              <label class="pill"><input type="radio" name="who" value="peer"><span data-i18n="dx.who.peer"></span></label>
              <label class="pill"><input type="radio" name="who" value="friends"><span data-i18n="dx.who.friends"></span></label>
              <label class="pill"><input type="radio" name="who" value="local"><span data-i18n="dx.who.local"></span></label>
              <label class="pill"><input type="radio" name="who" value="apu"><span data-i18n="dx.who.apu"></span></label>
              <label class="pill"><input type="radio" name="who" value="world"><span data-i18n="dx.who.world"></span></label>
              <label class="pill"><input type="radio" name="who" value="future"><span data-i18n="dx.who.future"></span></label>
              <label class="pill"><input type="radio" name="who" value="other"><span data-i18n="dx.who.other"></span></label>
            </div>
            <div class="dx__other" id="dxWhoOtherWrap" hidden>
              <label class="visually-hidden" for="dxWhoOther" data-i18n="dx.who.other"></label>
              <input class="input" id="dxWhoOther" type="text" maxlength="20" data-i18n-placeholder="dx.whoPlaceholder">
            </div>
            <p class="err" id="dxWhoErr" aria-live="polite"></p>
          </fieldset>

          <div class="dx__q">
            <label class="dx__label" for="dxWhat" data-i18n="dx.q2"></label>
            <input class="input" id="dxWhat" type="text" maxlength="30" data-i18n-placeholder="dx.whatPlaceholder" aria-describedby="dxWhatCount dxWhatErr">
            <p class="counter" id="dxWhatCount" aria-live="polite"></p>
            <p class="err" id="dxWhatErr" aria-live="polite"></p>
          </div>

          <div class="dx__q">
            <label class="dx__label" for="dxWhy" data-i18n="dx.q3"></label>
            <input class="input" id="dxWhy" type="text" maxlength="30" data-i18n-placeholder="dx.whyPlaceholder" aria-describedby="dxWhyCount dxWhyErr">
            <p class="counter" id="dxWhyCount" aria-live="polite"></p>
            <p class="err" id="dxWhyErr" aria-live="polite"></p>
          </div>

          <button type="submit" class="btn btn-primary btn-block" data-i18n="dx.submit"></button>
        </form>

        <div class="dx-result" id="dxResult" hidden tabindex="-1">
          <h3 class="dx-result__title" data-i18n="dx.resultTitle"></h3>
          <img id="dxImage" class="dx-result__img" alt="" width="1080" height="1350">
          <div class="dx-result__actions">
            <button type="button" class="btn btn-secondary btn-block" id="dxSave" data-i18n="dx.save"></button>
            <p class="help" data-i18n="dx.saveHint"></p>
          </div>
          <div class="dx-result__ask">
            <p class="dx-result__askText" data-i18n="dx.ask"></p>
            <div class="dx-result__links">
              <a class="btn btn-primary" href="entry.html" data-i18n="dx.toEntry"></a>
              <a class="btn btn-secondary" id="dxSpeakerLink" href="#speaker" data-i18n="dx.toSpeaker"></a>
            </div>
          </div>
          <button type="button" class="btn btn-ghost" id="dxRetry" data-i18n="dx.retry"></button>
        </div>
      </div>
    </section>
    <!-- ===== 5. 交流ミッション(独立セクション:削除してもOK) ===== -->
    <section id="missions" class="section section--tint reveal" aria-labelledby="ms-title">
      <div class="container">
        <p class="section__kicker" data-i18n="ms.kicker"></p>
        <h2 id="ms-title" class="section__title" data-i18n="ms.title"></h2>
        <p data-i18n="ms.lead"></p>

        <div class="rank card" aria-live="polite">
          <p class="rank__label" data-i18n="ms.rankLabel"></p>
          <p class="rank__name" id="msRank"></p>
          <div class="rank__bar" aria-hidden="true"><span id="msBar"></span></div>
          <p class="rank__count" id="msCount"></p>
        </div>

        <ul class="missions" id="msList" role="list"><!-- JSで生成 --></ul>

        <p class="note" data-i18n="ms.storage"></p>
        <button type="button" class="btn btn-ghost" id="msReset" data-i18n="ms.reset"></button>
      </div>
    </section>
