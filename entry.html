  <budoux-ja>
  <main id="main">
    <!-- ===== 6. 参加申込フォーム ===== -->
    <section id="entry" class="section section--entry" aria-labelledby="entry-title">
      <div class="container">
        <h2 id="entry-title" class="section__title" data-i18n="form.title"></h2>
        <p data-i18n="form.lead"></p>
        <p class="note note--lock" data-i18n="form.privacy"></p>

        <form id="entryForm" class="card form" novalidate>
          <p class="form__summary" id="entrySummary" role="alert" hidden></p>

          <!-- お名前 -->
          <div class="field" data-field="name">
            <label class="field__label" for="f-name">
              <span data-i18n="form.name"></span><span class="tag tag--req" data-i18n="common.required"></span>
            </label>
            <p class="help" id="f-name-help" data-i18n="form.nameHelp"></p>
            <input class="input" id="f-name" name="name" type="text" maxlength="50" autocomplete="nickname"
                   data-i18n-placeholder="form.namePlaceholder" aria-describedby="f-name-help f-name-err" aria-required="true">
            <p class="err" id="f-name-err"></p>
          </div>

          <!-- 所属 -->
          <div class="field" data-field="affiliation">
            <label class="field__label" for="f-aff">
              <span data-i18n="form.aff"></span><span class="tag tag--req" data-i18n="common.required"></span>
            </label>
            <select class="input select" id="f-aff" name="affiliation" aria-describedby="f-aff-err" aria-required="true">
              <option value="" data-i18n="form.selectPlaceholder"></option>
              <option value="aps" data-i18n="form.aff.aps"></option>
              <option value="apm" data-i18n="form.aff.apm"></option>
              <option value="st" data-i18n="form.aff.st"></option>
              <option value="grad" data-i18n="form.aff.grad"></option>
              <option value="intl" data-i18n="form.aff.intl"></option>
              <option value="staff" data-i18n="form.aff.staff"></option>
              <option value="other" data-i18n="form.aff.other"></option>
            </select>
            <div class="other-input" id="f-aff-other-wrap" hidden>
              <label class="visually-hidden" for="f-aff-other" data-i18n="form.affOtherLabel"></label>
              <input class="input" id="f-aff-other" name="affiliationOther" type="text" maxlength="50"
                     data-i18n-placeholder="form.affOtherPlaceholder" aria-describedby="f-aff-err">
            </div>
            <p class="err" id="f-aff-err"></p>
          </div>

          <!-- 学年 -->
          <div class="field" data-field="grade">
            <label class="field__label" for="f-grade">
              <span data-i18n="form.grade"></span><span class="tag tag--req" data-i18n="common.required"></span>
            </label>
            <select class="input select" id="f-grade" name="grade" aria-describedby="f-grade-err" aria-required="true">
              <option value="" data-i18n="form.selectPlaceholder"></option>
              <option value="g1" data-i18n="form.grade.g1"></option>
              <option value="g2" data-i18n="form.grade.g2"></option>
              <option value="g3" data-i18n="form.grade.g3"></option>
              <option value="g4" data-i18n="form.grade.g4"></option>
              <option value="grad" data-i18n="form.grade.grad"></option>
              <option value="other" data-i18n="form.grade.other"></option>
            </select>
            <div class="other-input" id="f-grade-other-wrap" hidden>
              <label class="visually-hidden" for="f-grade-other" data-i18n="form.gradeOtherLabel"></label>
              <input class="input" id="f-grade-other" name="gradeOther" type="text" maxlength="50"
                     data-i18n-placeholder="form.gradeOtherPlaceholder" aria-describedby="f-grade-err">
            </div>
            <p class="err" id="f-grade-err"></p>
          </div>

          <!-- 参加予定のセッション -->
          <fieldset class="field" data-field="slots" aria-describedby="f-slots-help f-slots-err">
            <legend class="field__label">
              <span data-i18n="form.slots"></span><span class="tag tag--req" data-i18n="common.required"></span>
            </legend>
            <p class="help" id="f-slots-help" data-i18n="form.slotsHelp"></p>
            <div class="check-list">
              <label class="check check--all"><input type="checkbox" id="f-slots-all"><span data-i18n="form.slot.all"></span></label>
              <label class="check"><input type="checkbox" name="slots" value="talk1"><span data-i18n="form.slot.talk1"></span></label>
              <label class="check"><input type="checkbox" name="slots" value="talk2"><span data-i18n="form.slot.talk2"></span></label>
              <label class="check"><input type="checkbox" name="slots" value="group"><span data-i18n="form.slot.group"></span></label>
              <label class="check"><input type="checkbox" name="slots" value="mingle"><span data-i18n="form.slot.mingle"></span></label>
              <label class="check"><input type="checkbox" name="slots" value="undecided"><span data-i18n="form.slot.undecided"></span></label>
            </div>
            <p class="err" id="f-slots-err"></p>
          </fieldset>

          <!-- 同行者の人数 -->
          <div class="field" data-field="companions">
            <label class="field__label" for="f-comp">
              <span data-i18n="form.companions"></span><span class="tag tag--opt" data-i18n="common.optional"></span>
            </label>
            <p class="help" id="f-comp-help" data-i18n="form.companionsHelp"></p>
            <div class="input-unit">
              <input class="input input--num" id="f-comp" name="companions" type="number" inputmode="numeric"
                     min="0" max="50" step="1" placeholder="0" aria-describedby="f-comp-help f-comp-err">
              <span data-i18n="form.companionsUnit"></span>
            </div>
            <p class="err" id="f-comp-err"></p>
          </div>

          <!-- メールアドレス -->
          <div class="field" data-field="email">
            <label class="field__label" for="f-email">
              <span data-i18n="form.email"></span><span class="tag tag--req" data-i18n="common.required"></span>
            </label>
            <p class="help" id="f-email-help" data-i18n="form.emailHelp"></p>
            <input class="input" id="f-email" name="email" type="email" inputmode="email" autocomplete="email" maxlength="254"
                   data-i18n-placeholder="form.emailPlaceholder" aria-describedby="f-email-help f-email-err" aria-required="true">
            <p class="err" id="f-email-err"></p>
          </div>

          <!-- やってみたいこと -->
          <div class="field" data-field="wish">
            <label class="field__label" for="f-wish">
              <span data-i18n="form.wish"></span><span class="tag tag--opt" data-i18n="common.optional"></span>
            </label>
            <p class="help" id="f-wish-help" data-i18n="form.wishHelp"></p>
            <input class="input" id="f-wish" name="wish" type="text" maxlength="100"
                   data-i18n-placeholder="form.wishPlaceholder" aria-describedby="f-wish-help">
          </div>

          <!-- 次回以降への関心 -->
          <div class="field field--publish" data-field="publish" hidden>
            <label class="check"><input type="checkbox" id="f-publish" name="publish" value="yes"><span data-i18n="form.publish"></span></label>
            <p class="help" data-i18n="form.publishHelp"></p>
          </div>

          <fieldset class="field" data-field="interests">
            <legend class="field__label">
              <span data-i18n="form.interest"></span><span class="tag tag--opt" data-i18n="common.optional"></span>
            </legend>
            <div class="check-list">
              <label class="check"><input type="checkbox" name="interests" value="speak"><span data-i18n="form.int.speak"></span></label>
              <label class="check"><input type="checkbox" name="interests" value="staff"><span data-i18n="form.int.staff"></span></label>
              <label class="check"><input type="checkbox" name="interests" value="group"><span data-i18n="form.int.group"></span></label>
            </div>
          </fieldset>

          <!-- 同意 -->
          <div class="field field--consent" data-field="consent">
            <p class="consent-note" id="f-consent-note" data-i18n="form.consentNote"></p>
            <label class="check check--consent">
              <input type="checkbox" id="f-consent" name="consent" value="yes" aria-describedby="f-consent-note f-consent-err" aria-required="true">
              <span><span data-i18n="form.consent"></span><span class="tag tag--req" data-i18n="common.required"></span></span>
            </label>
            <p class="err" id="f-consent-err"></p>
          </div>

          <button type="submit" class="btn btn-primary btn-block form__submit" id="entrySubmit" data-i18n="form.submit"></button>
          <p class="err form__send-err" id="entrySendErr" role="alert"></p>
        </form>

        <!-- 送信完了(ページを離れずに表示) -->
        <div class="card done" id="entryDone" hidden tabindex="-1">
          <div class="done__icon" aria-hidden="true">✓</div>
          <h3 class="done__title" data-i18n="form.doneTitle"></h3>
          <p data-i18n="form.doneBody"></p>
          <p class="help" id="entryDoneTest" data-i18n="form.doneTest" hidden></p>
          <a class="btn btn-secondary" href="index.html" data-i18n="form.doneBack"></a>
        </div>
      </div>
    </section>
    <section class="next" aria-label="next">
      <div class="container">
        <a class="next-card" href="faq.html">
          <span class="next-card__label" data-i18n="next.label"></span>
          <span class="next-card__name" data-i18n="hub.faq.name"></span>
          <span class="next-card__desc" data-i18n="hub.faq.desc"></span>
        </a>
      </div>
    </section>
  </main>
